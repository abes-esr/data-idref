name: "build-test-pubtodockerhub"

env:
  DOCKERHUB_IMAGE_PREFIX: abesesr/idref

on:
  push:
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-pubtodockerhub:
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Prepare version from git tags/branchs"
        id: docker_tag_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}
          flavor: |
            latest=auto
            suffix=-front

      - name: "Login to DockerHub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Buildx and push"
        id: push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request'  && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.docker_tag_meta.outputs.tags }}-data-idref
